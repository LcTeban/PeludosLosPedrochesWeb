<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin · Peludos Los Pedroches</title>
    <!-- Cargamos la librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #2c5f2d, #1a3a1b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', sans-serif;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
        }
        .logo { text-align: center; margin-bottom: 20px; font-size: 3rem; }
        h2 { color: #2c5f2d; text-align: center; margin-bottom: 10px; }
        p { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input {
            width: 100%; padding: 14px 15px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #e04f2e; }
        button {
            width: 100%; padding: 14px; background: #e04f2e; color: white;
            border: none; border-radius: 50px; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: background 0.3s;
        }
        button:hover { background: #c43d1e; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .error-message {
            color: #e04f2e; text-align: center; margin-top: 15px;
            display: none; font-size: 0.9rem;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🐾</div>
        <h2>Panel de Administración</h2>
        <p>Peludos Los Pedroches</p>
       
        <form id="loginForm">
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" placeholder="admin@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="········" required>
            </div>
            <button type="submit" id="loginBtn">INICIAR SESIÓN</button>
        </form>
       
        <div class="error-message" id="errorMessage">
            Correo o contraseña incorrectos
        </div>
    </div>
   
    <script>
        // Usamos una función autoejecutable (IIFE) para aislar las variables 
        // y evitar CUALQUIER conflicto de nombres con otros scripts.
        (function() {
            const SUPABASE_URL = 'https://grknhpyouzhmhqpjjomg.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdya25ocHlvdXpobWhxcGpqb21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDQ0NTQsImV4cCI6MjA5MjI4MDQ1NH0.z2z_eP7DCj_s-JY-ewzZ7RYXGZ0TgAOKzK4HxyoOeic';
            
            // Usamos un nombre de variable único (authClient) para evitar el error de "ya declarado"
            const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            // 1. Verificar si ya hay una sesión activa al cargar la página
            authClient.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    window.location.href = 'index.html';
                }
            });

            // 2. Manejar el envío del formulario
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault(); // Evita que la página se recargue
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMessage');
                const loginBtn = document.getElementById('loginBtn');

                // Estado de carga
                loginBtn.disabled = true;
                loginBtn.textContent = 'Verificando...';
                errorMsg.classList.remove('show');

                // Intentar iniciar sesión con Supabase
                const { data, error } = await authClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    // Mostrar error si las credenciales son incorrectas
                    errorMsg.textContent = error.message === 'Invalid login credentials' 
                        ? 'Correo o contraseña incorrectos' 
                        : 'Error de conexión. Inténtalo de nuevo.';
                    errorMsg.classList.add('show');
                    
                    // Restaurar el botón
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'INICIAR SESIÓN';
                } else {
                    // ¡Éxito! Redirigir al panel
                    window.location.href = 'index.html';
                }
            });
        })();
    </script>
</body>
</html>
