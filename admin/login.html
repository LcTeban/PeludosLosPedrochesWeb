<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin · Peludos Los Pedroches</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #2c5f2d, #1a3a1b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', sans-serif;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 3rem;
        }
        h2 {
            color: #2c5f2d;
            text-align: center;
            margin-bottom: 10px;
        }
        p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #e04f2e;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #e04f2e;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #c43d1e;
        }
        .error-message {
            color: #e04f2e;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .hint {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🐾</div>
        <h2>Panel de Administración</h2>
        <p>Peludos Los Pedroches</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="········" required>
            </div>
            <button type="submit">INICIAR SESIÓN</button>
        </form>
        
        <div class="error-message" id="errorMessage">
            Usuario o contraseña incorrectos
        </div>
        
        <div class="hint">
            Usuario: admin / Contraseña: Peludos2024!
        </div>
    </div>
    
    <script>
        // Verificar si ya está autenticado
        if (localStorage.getItem('adminToken') === 'authenticated') {
            window.location.href = 'index.html';
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            // Credenciales
            if (username === 'admin' && password === 'Peludos2024!') {
                localStorage.setItem('adminToken', 'authenticated');
                window.location.href = 'index.html';
            } else {
                errorMsg.classList.add('show');
                
                // Ocultar mensaje después de 3 segundos
                setTimeout(() => {
                    errorMsg.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
